syntax = "proto3";

option go_package = "capsulad/gen/go/capsula/framework/v1;frameworkv1";

package capsula.framework.v1;


// capsulad framework protocol.
//
// Local transport ONLY: gRPC over a Unix domain socket, e.g.
// unix:///run/capsulad/hal.sock
// No NETWORK gRPC listener or per-app sockets. The separate HTTPS Web UI uses
// a self-signed server certificate and authenticates with an Argon2id admin
// password plus static opaque API keys. (Draft 0.5 specified mandatory mTLS;
// this build replaces that at the project owner's request.) API keys protect
// only the HTTP surface, not the local Unix socket.
// No per-app RBAC or user-facing rule engine.
//
// Contract notes:
// - The framework launches and supervises all managed app processes.
// - All managed apps connect to the ONE framework Unix socket.
// - App-to-app calls are routed through AppBusService; apps host no sockets.
// - App identity is inferred from the supervised connection, not a supplied ID.
// - Persistent defaults select an app ID, never a predefined output port.
// - Presentations are dynamic; captures and conversation streams are scoped
//   to their owning app process and close explicitly or on app disconnect.
// - First message on a stream is the Open/Hello/Start request.
// - Time values are monotonic since boot unless specified otherwise.
// - A device advertises only capabilities its backend implements.
// - Native, QuickJS and MicroPython apps all use a per-process framework
//   transport adapter; script runtimes are launched by capsulad.

// -----------------------------------------------------------------------------
// Device and resource discovery
// -----------------------------------------------------------------------------

service DeviceService {
  rpc GetInfo(GetInfoRequest) returns (DeviceInfo);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc WatchResources(WatchResourcesRequest) returns (stream ResourceChange);
}

message GetInfoRequest {}
message DeviceInfo {
  string device_id = 1;
  string model = 2;
  string board_revision = 3;
  string soc = 4;
  string kernel = 5;
  string firmware = 6;
  string daemon_version = 7;
  string boot_id = 8;
  TargetPlatform target_platform = 9;
  repeated BackendAvailability subsystem_backends = 10;
}

// First implementation targets are the three Capsula Mini firmware variants.
// The large Capsula / Neo remain out of scope for implementation v0.1.
enum TargetPlatform {
  TARGET_PLATFORM_UNSPECIFIED = 0;
  CAPSULA_MINI_ROCKCHIP_STOCK = 1;
  CAPSULA_MINI_AMLOGIC_STOCK = 2;
  CAPSULA_MINI_AMLOGIC_ALPINE = 3;
}
enum BackendStatus {
  BACKEND_STATUS_UNSPECIFIED = 0;
  BACKEND_AVAILABLE = 1;
  BACKEND_PARTIAL = 2;
  BACKEND_UNAVAILABLE = 3;
  BACKEND_UNVERIFIED = 4;
}
message BackendAvailability {
  string subsystem = 1; // e.g. audio, segment, ring, touch, wakeword.
  string backend_id = 2;
  BackendStatus status = 3;
  string detail = 4;
}

message ListResourcesRequest {}
message WatchResourcesRequest {}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_SEGMENT_DISPLAY = 1;
  RESOURCE_LED_RING = 2;
  RESOURCE_TOUCH = 3;
  RESOURCE_AUDIO_INPUT = 4;
  RESOURCE_AUDIO_OUTPUT = 5;
  RESOURCE_SENSOR = 6;
  RESOURCE_VOICE_ASSISTANT_ROLE = 7;
  RESOURCE_OTHER = 8;
}

enum ResourceRouting {
  RESOURCE_ROUTING_UNSPECIFIED = 0;
  ROUTING_DEFAULT_WITH_CAPTURE = 1; // Display, ring, touch, assistant role.
  ROUTING_SHARED_STREAMS = 2;       // Speaker mixer and microphone fan-out.
  ROUTING_READ_ONLY = 3;            // Sensors, capability/state reads.
}

message SegmentCapabilities {
  uint32 digit_count = 1;
  bool supports_colon = 2;
  bool supports_decimal_points = 3;
}
message RingCapabilities {
  uint32 pixel_count = 1;
  bool supports_rgb = 2;
}

message TouchCapabilities {
  bool partial_gestures_available = 1;
  bool full_raw_available = 2;
  bool coordinates_available = 3;
  bool pressure_available = 4;
  repeated string semantic_gestures = 5;
  // The panel can deliver a complete key/gesture stream even when raw
  // coordinates are unavailable (for example the Mini's five gpio keys).
  bool full_panel_available = 6;
}

message ResourceInfo {
  string resource_id = 1;
  ResourceKind kind = 2;
  ResourceRouting routing = 3;
  bool available = 4;
  repeated string features = 5;
  string backend_name = 6; // Diagnostics only; applications must not assume ABI.
  oneof details {
    SegmentCapabilities segment = 7;
    RingCapabilities ring = 8;
    TouchCapabilities touch = 9;
  }
}
message ListResourcesResponse {
  uint64 revision = 1;
  repeated ResourceInfo resources = 2;
}
message ResourceChange {
  uint64 revision = 1;
  ResourceInfo resource = 2;
  bool removed = 3;
}

// -----------------------------------------------------------------------------
// User device settings. App-specific settings are declared in manifests and
// managed by ApplicationConfigurationService below.
// -----------------------------------------------------------------------------

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (SettingsSnapshot);
  rpc UpdateSettings(UpdateSettingsRequest) returns (SettingsSnapshot);
  rpc WatchSettings(WatchSettingsRequest) returns (stream SettingsSnapshot);
}

message GetSettingsRequest {}
message WatchSettingsRequest {}
enum TouchHoldMode {
  TOUCH_HOLD_MODE_UNSPECIFIED = 0;
  TOUCH_HOLD_SUMMON = 1; // Holding activates; conversation may outlive hold.
  TOUCH_HOLD_TO_TALK = 2; // Holding activates; release signals input end.
}
message UserSettings {
  // Physical output resource ID -> app ID, not a named presentation.
  map<string, string> default_app_by_resource = 1;
  string default_assistant_app_id = 2;
  string wakeword_model_id = 3;
  bool wakeword_enabled = 4;
  map<string, float> display_brightness = 5; // Global [0,1].
  float master_volume = 6;                    // Global [0,1].
  bool microphone_muted = 7;
  TouchHoldMode touch_hold_mode = 8;
  MutedMicrophoneIndicator muted_microphone_indicator = 9;
  // IANA zone name for the device wall clock. Empty follows the firmware's
  // /etc/localtime. Apps inherit the resolved value as TZ; an application
  // setting may override it for its own output.
  string timezone = 10;
  // Per display/ring resource: "const" uses display_brightness, "auto"
  // follows the ambient-light sensor. Missing means "const".
  map<string, string> brightness_mode = 11;
  // Allow inbound Bluetooth links. Off denies even already-paired devices
  // while the adapter stays powered for BLE; it also disables discoverability.
  bool bluetooth_incoming_connections = 15;
  // Advertise the adapter and accept new devices for discovery, connection and
  // pairing. True implies bluetooth_incoming_connections; disabling incoming
  // connections clears this. Already-paired devices may reconnect whenever
  // incoming connections are enabled, even while hidden.
  bool bluetooth_discoverable = 16;
  reserved 12;
  reserved "bluetooth_pairable";
  // Replay the startup cue on every boot. Off by default; installation plays
  // the cue once regardless of this value.
  bool startup_sound_enabled = 13;
  // Single DNS label for the mDNS advertisement, reachable as
  // <hostname>.local. Persisted by internal/settings; applied by the
  // discovery manager at startup and on change. Empty is invalid.
  string hostname = 14;
}
// Only controls how long the microphone-MUTED visual indication remains.
// It does not change the mute state or capture/watchdog indication policy.
enum MutedIndicatorMode {
  MUTED_INDICATOR_MODE_UNSPECIFIED = 0; // Daemon defaults to delay.
  MUTED_INDICATOR_IMMEDIATE = 1;
  MUTED_INDICATOR_DELAY = 2;
  MUTED_INDICATOR_UNTIL_UNMUTED = 3;
}
message MutedMicrophoneIndicator {
  MutedIndicatorMode mode = 1;
  uint32 delay_ms = 2; // Used only for MUTED_INDICATOR_DELAY.
}
message SettingsSnapshot {
  uint64 revision = 1;
  UserSettings values = 2;
}
message UpdateSettingsRequest {
  uint64 expected_revision = 1; // Compare-and-swap, else ABORTED.
  UserSettings values = 2;
  // Required paths for partial update, e.g. "touch_hold_mode",
  // "muted_microphone_indicator", "default_app_by_resource".
  // Map fields are replaced as a whole when included.
  repeated string update_fields = 3;
}

// -----------------------------------------------------------------------------
// Captures are temporary routing selections, not access permissions.
// The app explicitly releases by cancelling Capture(), or ReleaseCapture().
// The framework also releases a capture when its owning app exits.
// A capture becomes selectable only when its presentation has a valid frame.
// -----------------------------------------------------------------------------

service RoutingService {
  rpc GetRouting(GetRoutingRequest) returns (RoutingState);
  rpc WatchRouting(WatchRoutingRequest) returns (stream RoutingState);
  rpc Capture(CaptureRequest) returns (stream CaptureEvent);
  rpc ReleaseCapture(ReleaseCaptureRequest) returns (ReleaseCaptureResponse);
  rpc ForceRelease(ForceReleaseRequest) returns (ForceReleaseResponse);
}

message GetRoutingRequest { string resource_id = 1; }
message WatchRoutingRequest { string resource_id = 1; }
enum TouchCaptureMode {
  TOUCH_CAPTURE_MODE_UNSPECIFIED = 0;
  TOUCH_PARTIAL_GESTURES = 1; // System keeps volume and microphone toggle.
  TOUCH_FULL_RAW = 2;        // System suspends ALL default touch controls.
}
message CaptureRequest {
  string resource_id = 1;
  // Dynamic presentation ID for segment/ring. Empty for touch/assistant role.
  string presentation_id = 2;
  // Mandatory on touch; MUST be UNSPECIFIED for other resources.
  TouchCaptureMode touch_mode = 3;
}
message CaptureInfo {
  string capture_id = 1;
  string resource_id = 2;
  string app_id = 3;
  string run_id = 4;
  string presentation_id = 5;
  uint64 acquired_monotonic_ns = 6;
  bool selected = 7;
  bool ready = 8;
  TouchCaptureMode touch_mode = 9;
}
message RoutingState {
  string resource_id = 1;
  string configured_default_app_id = 2;
  string selected_presentation_id = 3;
  string selected_app_id = 4;
  repeated CaptureInfo captures = 5; // Acquisition order, non-LIFO release.
  uint64 revision = 6;
}
message CaptureGranted { CaptureInfo capture = 1; }
message CaptureSelectionChanged {
  bool selected = 1;
  string reason = 2;
}
message CaptureEvent {
  oneof event {
    CaptureGranted granted = 1;
    CaptureSelectionChanged changed = 2;
  }
}
message ReleaseCaptureRequest { string capture_id = 1; }
message ReleaseCaptureResponse { bool released = 1; }
message ForceReleaseRequest { string capture_id = 1; } // Diagnostics / UI.
message ForceReleaseResponse { bool released = 1; }

// -----------------------------------------------------------------------------
// Dynamic presentations. No port/source declarations or stable output IDs.
// Default apps maintain one implicit baseline presentation per resource.
// Additional presentations are shown only when explicitly captured.
// The first valid frame makes the presentation eligible for routing.
// Closing the stream explicitly releases the presentation. Process exit also
// cleans it up. Do not select a blank/unready presentation implicitly.
// -----------------------------------------------------------------------------

service PresentationService {
  rpc Open(stream PresentationRequest) returns (stream PresentationEvent);
  rpc ListPresets(ListPresentationPresetsRequest)
      returns (ListPresentationPresetsResponse);
}
message OpenPresentation { string resource_id = 1; }
message SegmentCell {
  uint32 mask = 1;         // Device-independent mapping to be finalized.
  bool decimal_point = 2;
}
message SegmentFrame {
  repeated SegmentCell cells = 1;
  bool colon = 2;
}
message RgbPixel {
  uint32 red = 1;         // Range [0,255].
  uint32 green = 2;
  uint32 blue = 3;
}
message RingFrame { repeated RgbPixel pixels = 1; }
// Effect and face are CONTENT of an existing presentation, not new
// resources or captures. The SDK method apply_effect() sends this update.
message PresetValue {
  oneof value {
    string text = 1;
    int64 integer = 2;
    double number = 3;
    bool boolean = 4;
    RgbPixel color = 5;
  }
}
message PresetArgument {
  string name = 1;
  PresetValue value = 2;
}
message RingEffect {
  string effect_id = 1; // e.g. system.ring.spinner
  repeated PresetArgument arguments = 2;
}
message SegmentFace {
  string face_id = 1; // e.g. system.display.face.neutral
  repeated PresetArgument arguments = 2;
}
message BlankPresentation {} // Explicitly blank; counts as first valid content.
message PresentationFrame {
  oneof payload {
    SegmentFrame segment = 1;
    RingFrame ring = 2;
    RingEffect ring_effect = 3;
    SegmentFace segment_face = 4;
    BlankPresentation blank = 5;
  }
}
enum PresetKind {
  PRESET_KIND_UNSPECIFIED = 0;
  PRESET_RING_EFFECT = 1;
  PRESET_SEGMENT_FACE = 2;
}
message PresetParameterDefinition {
  string name = 1;
  string description = 2;
  string value_type = 3; // text, integer, number, boolean, rgb.
  PresetValue default_value = 4;
  optional double min = 5;
  optional double max = 6;
}
message PresentationPresetInfo {
  string preset_id = 1;
  PresetKind kind = 2;
  string display_name = 3;
  string description = 4;
  repeated PresetParameterDefinition parameters = 5;
  repeated string supported_resource_ids = 6;
}
message ListPresentationPresetsRequest { string resource_id = 1; }
message ListPresentationPresetsResponse {
  repeated PresentationPresetInfo presets = 1;
}
message PresentationRequest {
  oneof request {
    OpenPresentation open = 1;
    PresentationFrame frame = 2;
    ClosePresentation close = 3;
  }
}
message ClosePresentation {} // Explicit normal completion; also close stream.
message PresentationReady {
  string presentation_id = 1; // Runtime only.
  string resource_id = 2;
  bool has_valid_frame = 3;
}
message PresentationVisibility {
  bool visible = 1;
  string reason = 2;
}
message PresentationEvent {
  oneof event {
    PresentationReady ready = 1;
    PresentationVisibility visibility = 2;
  }
}

// -----------------------------------------------------------------------------
// Audio: independent playback streams, fan-out capture, system-owned mixing
// -----------------------------------------------------------------------------

service AudioService {
  rpc ListEndpoints(ListAudioEndpointsRequest) returns (ListAudioEndpointsResponse);
  rpc Capture(CaptureAudioRequest) returns (stream CaptureAudioEvent);
  // First request MUST be `open`. Closing request side ends playback after
  // already queued data drains or according to the backend's drain policy.
  rpc Playback(stream PlaybackRequest) returns (stream PlaybackEvent);
  rpc GetAudioState(GetAudioStateRequest) returns (AudioState);
  rpc SetMasterVolume(SetMasterVolumeRequest) returns (AudioState);
  rpc SetMicrophoneMuted(SetMicrophoneMutedRequest) returns (AudioState);
}

enum AudioDirection {
  AUDIO_DIRECTION_UNSPECIFIED = 0;
  AUDIO_CAPTURE = 1;
  AUDIO_PLAYBACK = 2;
}
enum SampleFormat {
  SAMPLE_FORMAT_UNSPECIFIED = 0;
  PCM_S16LE = 1;
  PCM_F32LE = 2;
}
message AudioFormat {
  SampleFormat sample_format = 1;
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  repeated string channel_names = 4;
}
message AudioEndpointInfo {
  string endpoint_id = 1;
  AudioDirection direction = 2;
  repeated AudioFormat supported_formats = 3;
  string processing_tap = 4;  // Empty for a normal physical/raw tap.
}
message ListAudioEndpointsRequest {}
message ListAudioEndpointsResponse {
  repeated AudioEndpointInfo endpoints = 1;
}
message AudioChunk {
  uint64 sequence = 1;
  uint64 first_frame = 2;
  uint64 monotonic_time_ns = 3;
  uint32 frame_count = 4;
  bytes pcm = 5;
  bool discontinuity = 6;
  uint64 dropped_frames_before = 7;
}
message AudioNotice {
  string code = 1;  // e.g. "XRUN", "CLIENT_TOO_SLOW", "WATCHDOG_EXPIRED".
  string detail = 2;
}
message CaptureAudioRequest {
  string endpoint_id = 1;
  AudioFormat preferred_format = 2;
  uint32 packet_ms = 3;
  // Used by an assistant to obtain its bounded pre-roll, when available.
  string activation_id = 4;
  string conversation_id = 5;
}
message CaptureAudioStarted {
  string stream_id = 1;
  AudioFormat actual_format = 2;
  // Watchdog applies to app capture: a visible ring/segment indication must
  // remain active and updated. Idle framework wakeword detection is exempt.
  uint32 indication_watchdog_ms = 3;
}
message CaptureAudioEvent {
  oneof event {
    CaptureAudioStarted started = 1;
    AudioChunk chunk = 2;
    AudioNotice notice = 3;
  }
}
message OpenPlayback {
  string endpoint_id = 1;
  AudioFormat format = 2;
  uint32 target_latency_ms = 3;
  // This stream stays at normal gain during its own assistant conversation.
  string conversation_id = 4;
}
enum PlaybackCommand {
  PLAYBACK_COMMAND_UNSPECIFIED = 0;
  PLAYBACK_FLUSH = 1;
  PLAYBACK_PAUSE = 2;
  PLAYBACK_RESUME = 3;
}
message PlaybackRequest {
  oneof request {
    OpenPlayback open = 1;
    AudioChunk chunk = 2;
    PlaybackCommand control = 3;
  }
}
message PlaybackStarted {
  string stream_id = 1;
  AudioFormat actual_format = 2;
}
message PlaybackProgress {
  uint64 frames_played = 1;
  uint64 frames_queued = 2;
}
message PlaybackEvent {
  oneof event {
    PlaybackStarted started = 1;
    PlaybackProgress progress = 2;
    AudioNotice notice = 3;
  }
}
message GetAudioStateRequest {}
message SetMasterVolumeRequest { float volume = 1; } // [0,1].
message SetMicrophoneMutedRequest { bool muted = 1; }
message AudioState {
  float master_volume = 1;
  bool microphone_muted = 2;
  bool microphone_mute_is_hardware = 3;
}

// -----------------------------------------------------------------------------
// Touch/gesture input
// -----------------------------------------------------------------------------

service InputService {
  rpc WatchInput(WatchInputRequest) returns (stream InputEvent);
}
message WatchInputRequest {
  string resource_id = 1;
  // Must reference the caller's current selected touch capture. No bypass
  // subscription exposing system volume/microphone-toggle gestures.
  string capture_id = 2;
}
message KeyInput {
  string key = 1;
  bool pressed = 2;
}
message GestureInput {
  string gesture_id = 1; // e.g. "hold", "tap", "swipe_left".
  string phase = 2;      // e.g. "start", "update", "end".
}
message RawTouchContact {
  uint32 contact_id = 1;
  float x_normalized = 2; // [0,1] ONLY when coordinates_available.
  float y_normalized = 3; // [0,1] ONLY when coordinates_available.
  optional float pressure = 4;
  bool touching = 5;
}
message RawTouchReport {
  repeated RawTouchContact contacts = 1;
  // If native controller reports discrete/raw events without coordinates,
  // backend may expose opaque samples with an advertised data format.
  bytes backend_sample = 2;
  string backend_sample_format = 3;
  bool coordinates_valid = 4;
}
message InputEvent {
  string resource_id = 1;
  uint64 monotonic_time_ns = 2;
  oneof event {
    KeyInput key = 3;
    GestureInput gesture = 4;
    RawTouchReport raw = 5; // FULL_RAW only.
  }
}

// -----------------------------------------------------------------------------
// Framework-owned wakeword detection and minimally managed assistants.
// The selected assistant is a ready, always-running supervised application.
// The framework sends activation over its AppBus.Connect() stream.
// There is no activation acknowledgement requirement or activation-time launch.
// Assistant decides when to begin capture; late capture can lose audio.
// -----------------------------------------------------------------------------

service AssistantService {
  rpc ListWakewordModels(ListWakewordModelsRequest)
      returns (ListWakewordModelsResponse);
  // Optional lifetime marker for automatic audio ducking; NOT a priority API.
  rpc BeginConversation(BeginConversationRequest)
      returns (stream ConversationEvent);
  // Keyword training workflow: the device records takes, trains the embedding
  // classifier on-device, and installs it only when every quality gate passes.
  // No audio or feature data leaves the unit. The browser only supplies the
  // explicit sample selection and displays progress.
  rpc RecordWakewordSample(RecordWakewordSampleRequest)
      returns (RecordWakewordSampleResponse);
  rpc ListWakewordSamples(ListWakewordSamplesRequest)
      returns (ListWakewordSamplesResponse);
  rpc DeleteWakewordSample(DeleteWakewordSampleRequest)
      returns (DeleteWakewordSampleResponse);
  // Server-streaming training progress and the final installed classifier.
  // A failed gate or a cancelled request ends the stream with an error and
  // leaves the installed model untouched.
  rpc TrainWakewordClassifier(TrainWakewordClassifierRequest)
      returns (stream TrainWakewordEvent);
}

message WakewordSample {
  reserved 4;
  reserved "mel_frames";
  string sample_id = 1;
  string label = 2;             // "word" or "background"
  uint32 duration_ms = 3;
  int64 recorded_unix_ms = 5;
}
message RecordWakewordSampleRequest {
  // "word", "speech" (unrelated phrase) or "room" (background). "speech" and
  // "word" takes play the audible start cue; all takes pulse the ring red.
  // "background" remains accepted as a legacy alias for a silent room take.
  string label = 1;
  uint32 duration_ms = 2;       // default 1600
}
message RecordWakewordSampleResponse { WakewordSample sample = 1; }
message ListWakewordSamplesRequest {}
message ListWakewordSamplesResponse { repeated WakewordSample samples = 1; }
message DeleteWakewordSampleRequest { string sample_id = 1; }
message DeleteWakewordSampleResponse {}
message TrainWakewordClassifierRequest {
  string display_name = 1;      // the wake word as shown to the user
  string language = 2;          // BCP-47 tag, for example "ru"
  uint64 seed = 3;              // reproducible training shuffle and init
  // Explicit current selection. The device trains only these takes; omitting
  // recordings must never pull older takes into the model implicitly.
  repeated string word_sample_ids = 4;     // each labelled "word"
  repeated string room_sample_ids = 5;     // room-tone background takes
  repeated string speech_sample_ids = 6;   // unrelated-speech background takes
  repeated string false_sample_ids = 7;    // optional known false activations
}
message WakewordClassifierInfo {
  string model_id = 1;
  string display_name = 2;
  string language = 3;
  float threshold = 4;
  uint32 context_frames = 5;
  uint32 embedding_dim = 6;
  uint32 projection_width = 7;
  uint32 hidden_width = 8;
}
message TrainWakewordEvent {
  string stage = 1;             // stable machine-readable phase name
  float fraction = 2;           // [0,1] within the whole job
  string log = 3;               // optional human-readable detail
  // Set only on the final success event, after the classifier is installed.
  WakewordClassifierInfo classifier = 4;
}
message ListWakewordModelsRequest {}
message WakewordModelInfo {
  string model_id = 1;
  string display_name = 2;
  string language = 3;
  string engine_id = 4;
  bool available = 5;
}
message ListWakewordModelsResponse {
  repeated WakewordModelInfo models = 1;
}
enum ActivationOrigin {
  ACTIVATION_ORIGIN_UNSPECIFIED = 0;
  ACTIVATION_WAKEWORD = 1;
  ACTIVATION_TOUCH = 2;
  ACTIVATION_API = 3;
}
message AssistantActivation {
  string activation_id = 1;
  ActivationOrigin origin = 2;
  string matched_model_id = 3;
  uint64 monotonic_time_ns = 4;
  uint64 expires_monotonic_ns = 5;
  // Set for touch activations when the device is in hold-to-talk mode: the
  // release arrives as a separate AssistantInputReleased AppBus event and ends
  // input. It is false in summon mode, where the turn may outlive the hold.
  // Carried on the activation so an assistant does not need the
  // administrator-only device settings surface to know this per-turn rule.
  bool hold_to_talk = 6;
}
message AssistantInputReleased { string activation_id = 1; }
message BeginConversationRequest { string activation_id = 1; }
message ConversationStarted { string conversation_id = 1; }
message ConversationNotice {
  string code = 1;
  string detail = 2;
}
message ConversationEvent {
  oneof event {
    ConversationStarted started = 1;
    ConversationNotice notice = 2;
  }
}

// -----------------------------------------------------------------------------
// Installed applications, process supervision, typed settings and buttons.
// -----------------------------------------------------------------------------

service ApplicationService {
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse);
  rpc GetBinaryProvenance(GetBinaryProvenanceRequest)
      returns (BinaryProvenanceResult);
  rpc Launch(LaunchRequest) returns (LaunchResult);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc WatchRuns(WatchRunsRequest) returns (stream AppRunEvent);
}
enum ApplicationRuntime {
  APPLICATION_RUNTIME_UNSPECIFIED = 0;
  RUNTIME_NATIVE = 1;
  RUNTIME_QUICKJS = 2;
  RUNTIME_MICROPYTHON = 3;
  // Compiled into capsulad. Such an application has a normal identity, app
  // settings, run lifecycle and app-bus endpoints, but no package directory,
  // child process or install/uninstall operation.
  RUNTIME_BUILTIN = 4;
}
message ApplicationEntrypoint {
  ApplicationRuntime runtime = 1;
  // Path relative to immutable /app/, not an arbitrary shell command.
  string relative_path = 2;
  // Native binary package compatibility; empty for scripts.
  string cpu_architecture = 3;
  string binary_abi = 4;
  // Required SDK/host API compatibility version, if specified.
  string framework_sdk_version = 5;
}
message RuntimeAvailability {
  ApplicationRuntime runtime = 1;
  bool available = 2;
  string implementation_version = 3;
  string detail = 4;
}
message ListRuntimesRequest {}
message ListRuntimesResponse {
  repeated RuntimeAvailability runtimes = 1;
}

// Manifest may DECLARE GitHub provenance evidence for a native binary.
// Verified status is calculated independently by the framework.
message GitHubAttestationDeclaration {
  string bundle_path = 1;     // Relative immutable /app path.
  string subject_path = 2;    // Relative native executable under /app.
  string expected_repository = 3; // e.g. org/repo
  string expected_workflow = 4;   // Optional exact workflow identity.
}
enum ProvenanceStatus {
  PROVENANCE_STATUS_UNSPECIFIED = 0;
  PROVENANCE_NOT_PROVIDED = 1;
  PROVENANCE_VERIFIED = 2;
  PROVENANCE_VERIFICATION_FAILED = 3;
  PROVENANCE_UNVERIFIED = 4;
  PROVENANCE_UNSUPPORTED_RUNTIME = 5;
}
message BinaryProvenanceResult {
  string app_id = 1;
  ProvenanceStatus status = 2;
  string detail = 3;
  string subject_sha256_hex = 4;
  string verified_repository = 5;
  string verified_repository_id = 6;
  string verified_workflow = 7;
  string verified_commit_sha = 8;
  uint64 verified_at_unix_ms = 9;
  bool trusted_root_current = 10;
}
message GetBinaryProvenanceRequest { string app_id = 1; }

message AppArgumentInfo {
  string name = 1;
  string description = 2;
  string value_type = 3; // Simple typed launch UI metadata.
  bool required = 4;
}
message InstalledApplication {
  string app_id = 1;
  string display_name = 2;
  string version = 3;
  bool start_on_boot = 4;
  bool single_instance = 5;
  repeated AppArgumentInfo launch_arguments = 6;
  // Nonexclusive UI hints: segment_display_provider, media_player,
  // led_ring_controller, voice_assistant, or arbitrary app-defined tags.
  repeated string provides = 7;
  bool background = 8;
  bool restart_on_failure = 9;
  repeated DeclaredAppInterface interfaces = 10;
  ApplicationEntrypoint entrypoint = 11;
  GitHubAttestationDeclaration github_attestation = 12;
  // Server-owned lifecycle metadata. Clients must not infer these from the
  // app ID: built-in system apps and supervised packages are distinguished
  // only by what the daemon reports here.
  bool system_app = 13;
  bool can_stop = 14;
  bool can_uninstall = 15;
}
message DeclaredAppInterface {
  string grpc_service = 1;
  string interface_version = 2;
  string summary = 3;
}
message ListApplicationsRequest {}
message ListApplicationsResponse {
  repeated InstalledApplication applications = 1;
}
message LaunchArgument {
  string name = 1;
  string value = 2; // Manifest defines its type; no shell parsing.
}
message LaunchRequest {
  string app_id = 1;
  repeated LaunchArgument arguments = 2;
}
message LaunchResult {
  string run_id = 1;
  bool spawned_new_process = 2;
  string invocation_id = 3; // Also set for already-running singleton.
}
message StopRequest { string run_id = 1; }
message StopResponse { bool requested = 1; }
message ListRunsRequest { string app_id = 1; }
message WatchRunsRequest { string app_id = 1; }
enum AppRunState {
  APP_RUN_STATE_UNSPECIFIED = 0;
  APP_STARTING = 1;
  APP_READY = 2;
  APP_STOPPING = 3;
  APP_EXITED = 4;
  APP_FAILED = 5;
}
message AppRun {
  string run_id = 1;
  string app_id = 2;
  uint32 pid = 3;
  AppRunState state = 4;
  uint64 started_monotonic_ns = 5;
  int32 exit_code = 6;
  string status_detail = 7;
  ApplicationRuntime runtime = 8;
}
message ListRunsResponse { repeated AppRun runs = 1; }
message AppRunEvent { AppRun run = 1; }

// Framework persists application settings from the manifest and renders a
// simple form in the Web UI; buttons are actions, not persisted settings.
service ApplicationConfigurationService {
  rpc Describe(DescribeAppConfigurationRequest)
      returns (AppConfigurationSchema);
  rpc Get(GetAppConfigurationRequest)
      returns (AppConfigurationSnapshot);
  rpc Update(UpdateAppConfigurationRequest)
      returns (AppConfigurationSnapshot);
  rpc TriggerAction(TriggerAppActionRequest)
      returns (TriggerAppActionResult);
}
enum SettingType {
  SETTING_TYPE_UNSPECIFIED = 0;
  SETTING_TEXT = 1;
  SETTING_TEXT_MASKED = 2;
  SETTING_BOOLEAN = 3;
  SETTING_INTEGER = 4;
  SETTING_NUMBER = 5;
  SETTING_SELECT = 6;
}
message SettingChoice { string value = 1; string label = 2; }
message AppSettingDefinition {
  string key = 1;
  string label = 2;
  string description = 3;
  SettingType type = 4;
  string default_value_json = 5;
  repeated SettingChoice choices = 6;
  bool required = 7;
  bool restart_required = 8;
  // Numeric min/max are only used when true. No advanced expression DSL.
  bool has_min = 9;
  double min = 10;
  bool has_max = 11;
  double max = 12;
}
message AppActionDefinition {
  string action_id = 1;
  string label = 2;
  string description = 3;
  bool confirm_before_run = 4;
}
message DescribeAppConfigurationRequest { string app_id = 1; }
message AppConfigurationSchema {
  string app_id = 1;
  repeated AppSettingDefinition settings = 2;
  repeated AppActionDefinition actions = 3;
}
message GetAppConfigurationRequest { string app_id = 1; }
message AppSettingState {
  string key = 1;
  string value_json = 2; // Empty for TEXT_MASKED, always redacted here.
  bool has_value = 3;
}
message AppConfigurationSnapshot {
  string app_id = 1;
  uint64 revision = 2;
  repeated AppSettingState values = 3;
}
message AppSettingChange {
  string key = 1;
  string value_json = 2;
  bool clear = 3; // Explicit clear, needed for masked fields.
}
message UpdateAppConfigurationRequest {
  string app_id = 1;
  uint64 expected_revision = 2; // Compare-and-swap.
  repeated AppSettingChange changes = 3;
}
message TriggerAppActionRequest {
  string app_id = 1;
  string action_id = 2;
}
message TriggerAppActionResult { string action_invocation_id = 1; }

// Descriptors/docs describe custom methods but no per-app endpoint exists.
// The caller uses AppBusService.Call(), targeting app_id+service+method.
service AppInterfaceService {
  rpc ListInterfaces(ListAppInterfacesRequest) returns (ListAppInterfacesResponse);
  rpc DescribeInterface(DescribeAppInterfaceRequest)
      returns (AppInterfaceDescription);
}
message ListAppInterfacesRequest {
  string app_id = 1; // Empty means all installed apps.
  bool running_only = 2;
}
message AppInterfaceInfo {
  string app_id = 1;
  string run_id = 2; // Empty if not running.
  string grpc_service = 3;
  string interface_version = 4;
  bool available = 5; // True only if selected run has sent AppReady.
  string summary = 6;
}
message ListAppInterfacesResponse {
  repeated AppInterfaceInfo interfaces = 1;
}
message DescribeAppInterfaceRequest {
  string app_id = 1;
  string grpc_service = 2;
}
message AppMethodDocumentation {
  string rpc_name = 1;
  string summary = 2;
  string semantics_markdown = 3;
  string request_example_json = 4;
  string response_example_json = 5;
}
message AppInterfaceDescription {
  AppInterfaceInfo info = 1;
  // Serialized google.protobuf.FileDescriptorSet including imports.
  bytes file_descriptor_set = 2;
  string documentation_markdown = 3;
  repeated AppMethodDocumentation methods = 4;
}

// Reverse-RPC transport. Each app maintains ONE long-lived Connect stream
// to capsulad. This carries incoming custom calls, launch invocations,
// setting changes, buttons and assistant activations. SDKs decode payloads.
// Call() is the caller's stream for one custom app RPC. The framework relays
// frames; application processes never listen on separate sockets.
service AppBusService {
  rpc Connect(stream AppOutbound) returns (stream AppInbound);
  rpc Call(stream RoutedCallRequest) returns (stream RoutedCallResponse);
}
message AppHello { string run_id = 1; } // Verified against daemon-spawned PID.
message AppReady {}
message AppCallReply {
  string call_id = 1;
  oneof result {
    bytes response_message = 2; // Serialized protobuf response message.
    AppCallEnd end = 3;
  }
}
message AppCallEnd {
  int32 grpc_status_code = 1; // 0 = OK; otherwise canonical gRPC code.
  string detail = 2;
}
message AppInvocationResult {
  string invocation_id = 1;
  bool accepted = 2;
  string detail = 3;
}
message AppActionResult {
  string action_invocation_id = 1;
  bool succeeded = 2;
  string detail = 3;
}
message AppOutbound {
  oneof message {
    AppHello hello = 1;
    AppReady ready = 2;
    AppCallReply call_reply = 3;
    AppInvocationResult invocation_result = 4;
    AppActionResult action_result = 5;
  }
}
message IncomingAppCall {
  string call_id = 1;
  string caller_run_id = 2;
  string grpc_service = 3;
  string rpc_name = 4;
  uint64 deadline_monotonic_ns = 5;
}
message IncomingCallData {
  string call_id = 1;
  bytes request_message = 2;
}
message IncomingCallHalfClose { string call_id = 1; }
message IncomingCallCancel { string call_id = 1; }
message AppLaunchInvocation {
  string invocation_id = 1;
  repeated LaunchArgument arguments = 2;
}
message AppPrivateSetting {
  string key = 1;
  string value_json = 2; // Private configuration sent only to owning app.
}
message AppSettingsChanged {
  uint64 revision = 1;
  repeated AppPrivateSetting values = 2;
  // Only this app-connected event carries its text_masked values.
}
message AppActionInvoked {
  string action_invocation_id = 1;
  string action_id = 2;
}
message AppInbound {
  oneof message {
    IncomingAppCall call = 1;
    IncomingCallData call_data = 2;
    IncomingCallHalfClose call_half_close = 3;
    IncomingCallCancel call_cancel = 4;
    AppLaunchInvocation invocation = 5;
    AppSettingsChanged settings_changed = 6;
    AppActionInvoked action = 7;
    AssistantActivation activation = 8;
    AssistantInputReleased touch_released = 9;
  }
}
message RoutedCallStart {
  string target_app_id = 1;
  string grpc_service = 2; // Fully-qualified protobuf service.
  string rpc_name = 3;
  uint32 timeout_ms = 4;
}
message CallHalfClose {}
message RoutedCallRequest {
  oneof message {
    RoutedCallStart start = 1;
    bytes request_message = 2; // Serialized protobuf request message.
    CallHalfClose half_close = 3;
  }
}
message RoutedCallResponse {
  oneof message {
    bytes response_message = 1;
    AppCallEnd end = 2;
  }
}

// -----------------------------------------------------------------------------
// Sensors, system service units and diagnostics (capability-checked)
// -----------------------------------------------------------------------------

service SensorService {
  rpc ListSensors(ListSensorsRequest) returns (ListSensorsResponse);
  rpc ReadSensor(ReadSensorRequest) returns (SensorSample);
  rpc WatchSensor(WatchSensorRequest) returns (stream SensorSample);
}
message ListSensorsRequest {}
message SensorInfo {
  string sensor_id = 1;
  string unit = 2;
}
message ListSensorsResponse { repeated SensorInfo sensors = 1; }
message ReadSensorRequest { string sensor_id = 1; }
message WatchSensorRequest {
  string sensor_id = 1;
  uint32 minimum_interval_ms = 2;
}
message SensorSample {
  string sensor_id = 1;
  double value = 2;
  string unit = 3;
  uint64 monotonic_time_ns = 4;
}

service SystemService {
  rpc GetStatus(GetStatusRequest) returns (SystemStatus);
  // Bluetooth adapter state and discoverability. Present=false when the
  // backend cannot drive or observe an adapter.
  rpc GetBluetoothStatus(GetBluetoothStatusRequest) returns (BluetoothStatus);
  // Discoverability advertises the adapter and permits new devices to find,
  // connect and pair. It implies incoming connections; disabling incoming
  // connections also disables discoverability.
  rpc SetBluetoothDiscoverable(SetBluetoothDiscoverableRequest) returns (BluetoothStatus);
  // Incoming connections controls inbound links. Off denies even paired
  // devices while the adapter remains powered for BLE. Turning it off also
  // disables discoverability.
  rpc SetBluetoothIncomingConnections(SetBluetoothIncomingConnectionsRequest)
      returns (BluetoothStatus);
  // Paired-device management is a local administrator operation: the daemon
  // rejects it for supervised application callers.
  rpc ListPairedDevices(ListPairedDevicesRequest) returns (ListPairedDevicesResponse);
  rpc UnpairDevice(UnpairDeviceRequest) returns (UnpairDeviceResponse);
  // Read-only Web UI ingress state. Certificate provisioning/renewal is a
  // local administrator CLI/bootstrap responsibility, not an app RPC.
  rpc GetWebUiSecurity(GetWebUiSecurityRequest)
      returns (WebUiSecurityStatus);
  // Optional backend-specific system-service operations.
  rpc ListUnits(ListUnitsRequest) returns (ListUnitsResponse);
  rpc ControlUnit(ControlUnitRequest) returns (UnitInfo);
}
message GetBluetoothStatusRequest {}
message SetBluetoothDiscoverableRequest { bool discoverable = 1; }
message SetBluetoothIncomingConnectionsRequest { bool incoming_connections = 1; }
message BluetoothStatus {
  bool present = 1;
  bool powered = 2;
  bool discoverable = 3;
  string adapter = 4;   // e.g. hci0
  string detail = 5;    // backend explanation, never a false success
  reserved 6;
  reserved "pairable";
  // Observed BR/EDR connectability from the public Linux Bluetooth management
  // API. False with powered=true is the truthful "radio on, inbound denied"
  // state; it is never inferred from the discoverable property.
  bool incoming_connections = 7;
  // Advertised adapter name (BlueZ Adapter1.Alias fallback Name).
  string name = 8;
}
message ListPairedDevicesRequest {}
message PairedDevice {
  string address = 1;   // e.g. BC:D0:74:32:51:DC
  string name = 2;      // alias or address when unnamed
  bool connected = 3;
  bool trusted = 4;
}
message ListPairedDevicesResponse { repeated PairedDevice devices = 1; }
message UnpairDeviceRequest { string address = 1; }
message UnpairDeviceResponse { bool removed = 1; }

// BluetoothMediaService exposes the connected A2DP source's AVRCP state to
// apps. Media control and metadata travel through the standard app-provided
// media-player contract; this service is the framework side of that bridge.
service BluetoothMediaService {
  rpc GetState(GetBluetoothMediaStateRequest) returns (BluetoothMediaState);
  // First message is the current state, then one per change.
  rpc WatchState(WatchBluetoothMediaStateRequest)
      returns (stream BluetoothMediaState);
  rpc Command(BluetoothMediaCommandRequest) returns (BluetoothMediaState);
}
message GetBluetoothMediaStateRequest {}
message WatchBluetoothMediaStateRequest {}
enum BluetoothMediaCommand {
  BLUETOOTH_MEDIA_COMMAND_UNSPECIFIED = 0;
  BLUETOOTH_MEDIA_PLAY = 1;
  BLUETOOTH_MEDIA_PAUSE = 2;
  BLUETOOTH_MEDIA_TOGGLE = 3;
  BLUETOOTH_MEDIA_NEXT = 4;
  BLUETOOTH_MEDIA_PREVIOUS = 5;
}
message BluetoothMediaCommandRequest { BluetoothMediaCommand command = 1; }
message BluetoothMediaState {
  bool present = 1;          // a remote source is connected
  bool playing = 2;
  string device_address = 3;
  string device_name = 4;
  string title = 5;
  string artist = 6;
  string album = 7;
  uint64 duration_ms = 8;
  uint64 position_ms = 9;
  uint64 revision = 10;      // monotonic across this daemon's lifetime
  string detail = 11;        // why metadata/control is unavailable, if so
}
message GetWebUiSecurityRequest {}
message WebUiSecurityStatus {
  bool https_enabled = 1;
  // False in this build: the listener uses a self-signed certificate and
  // authenticates browsers with an admin password plus static API keys.
  bool client_certificate_required = 2;
  bool bootstrap_complete = 3; // Certificate and admin password exist.
  repeated string listen_addresses = 4;
  // Unused legacy field retained for draft compatibility.
  repeated string trusted_client_ca_sha256 = 5;
  uint64 server_certificate_expiry_unix_ms = 6;
  // Non-secret self-signed certificate fingerprint(s).
  repeated string server_certificate_sha256 = 7;
  uint32 active_api_keys = 8;
  bool admin_password_set = 9;
  // Private keys, API keys and password hashes are never returned.
}
message GetStatusRequest {}
message SystemStatus {
  uint64 uptime_ms = 1;
  string boot_id = 2;
  string daemon_version = 3;
}
message ListUnitsRequest {}
message UnitInfo {
  string unit_id = 1;
  string state = 2;
}
message ListUnitsResponse { repeated UnitInfo units = 1; }
message ControlUnitRequest {
  string unit_id = 1;
  enum Action {
    ACTION_UNSPECIFIED = 0;
    START = 1;
    STOP = 2;
    RESTART = 3;
  }
  Action action = 2;
}

service DiagnosticsService {
  rpc GetSnapshot(GetDiagnosticsRequest) returns (DiagnosticsSnapshot);
  rpc WatchLogs(WatchLogsRequest) returns (stream LogRecord);
}
message GetDiagnosticsRequest {}
message ActiveAudioStreamInfo {
  string stream_id = 1;
  string app_id = 2;
  string endpoint_id = 3;
  bool input = 4;
  bool indication_active = 5;
  uint64 opened_monotonic_ns = 6;
}
message DiagnosticsSnapshot {
  repeated RoutingState routed_resources = 1;
  repeated AppRun runs = 2;
  repeated ActiveAudioStreamInfo audio_streams = 3;
  uint64 monotonic_time_ns = 4;
}
message WatchLogsRequest { string app_id = 1; }
message LogRecord {
  uint64 monotonic_time_ns = 1;
  string component = 2;
  string app_id = 3;
  string severity = 4;
  string message = 5;
}

// -----------------------------------------------------------------------------
// Shared framework-provided read-only assets. No new playback service. The
// store directory is the catalog: asset_id is the slash-relative path below the
// store root, and path is the canonical /assets/<asset_id> location inside
// every app sandbox. There is no manifest, license or required-asset metadata.
// -----------------------------------------------------------------------------
service AssetService {
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
}
message ListAssetsRequest {
  // Matches the start of asset_id. An empty prefix lists the whole store.
  // A /assets/... prefix is accepted as an alias.
  string prefix = 1;
}
message SharedAssetInfo {
  string asset_id = 1;
  string path = 2; // Canonical /assets/... path inside every app sandbox.
  string media_type = 3;
  string sha256_hex = 4;
  uint64 size_bytes = 5;
  reserved 6, 7;
  reserved "license", "attribution", "required_base_asset";
}
message ListAssetsResponse { repeated SharedAssetInfo assets = 1; }
