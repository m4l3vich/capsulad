syntax = "proto3";

option go_package = "capsulad/gen/go/capsulad/contracts/media/v1;mediav1";

package capsulad.contracts.media.v1;

// Optional standard app-provided interface; NOT implemented by capsulad.
// Clients discover app contracts through capsulad.framework.v1.AppInterfaceService;
// requests are relayed through AppBusService.Call, not an app socket.
// Local transport: gRPC over Unix socket only. A single app may expose several
// independently controllable players. This standard does not control HAL ducking.

service MediaPlayerService {
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  // First event must be a snapshot of all players, then incremental changes.
  // The stream is cancelled when the app disconnects or stops.
  rpc WatchPlayers(WatchPlayersRequest) returns (stream PlayerEvent);
  rpc GetStatus(GetStatusRequest) returns (PlayerStatus);
  rpc Play(PlayerRequest) returns (PlayerCommandResult);
  rpc Pause(PlayerRequest) returns (PlayerCommandResult);
  rpc SkipNext(PlayerRequest) returns (PlayerCommandResult);
  rpc SkipPrevious(PlayerRequest) returns (PlayerCommandResult);
}

message ListPlayersRequest {}
message WatchPlayersRequest {}
message GetStatusRequest { string player_id = 1; }
message PlayerRequest { string player_id = 1; }

// The server acknowledges the command, but actual playback/metadata changes
// can be asynchronous and are reported by WatchPlayers/GetStatus.
message PlayerCommandResult {
  bool accepted = 1;
  string detail = 2;
}

enum PlaybackState {
  PLAYBACK_STATE_UNSPECIFIED = 0;
  PLAYBACK_STOPPED = 1;
  PLAYBACK_PLAYING = 2;
  PLAYBACK_PAUSED = 3;
  PLAYBACK_BUFFERING = 4;
}

enum MediaAction {
  MEDIA_ACTION_UNSPECIFIED = 0;
  MEDIA_PLAY = 1;
  MEDIA_PAUSE = 2;
  MEDIA_SKIP_NEXT = 3;
  MEDIA_SKIP_PREVIOUS = 4;
}

message PlayerStatus {
  // Unique within the provider app; stable during a player's live lifetime.
  string player_id = 1;
  PlaybackState playback_state = 2;
  repeated MediaAction supported_actions = 3;

  // Display-friendly media indication, with NO title inference required.
  string app_name = 4;           // "AirPlay"
  string source_name = 5;        // "Apple Music — John's iPhone"
  optional string media_name = 6; // "Scarlet Fire — Otis McDonald"

  // Optional structured metadata for consumers wanting to format a display.
  optional string title = 7;   // "Scarlet Fire"
  optional string artist = 8;  // "Otis McDonald"
  optional string album = 9;
  optional uint64 duration_ms = 10;
  optional uint64 position_ms = 11;

  uint64 revision = 12; // Monotonically increasing within this player lifetime.
}
message ListPlayersResponse { repeated PlayerStatus players = 1; }
message PlayerRemoved { string player_id = 1; }
message PlayerEvent {
  oneof event {
    ListPlayersResponse snapshot = 1; // Always the first event.
    PlayerStatus updated = 2;
    PlayerRemoved removed = 3;
  }
}
