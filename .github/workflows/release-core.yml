name: release-core

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          branch="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$branch"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [meta, verify]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        libc: [gnu, musl]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build core
        run: make core LIBC=${{ matrix.libc }} PROFILE=release
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.libc }}
          path: build/${{ matrix.libc }}/release
          retention-days: 7

  installer:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.6"
          cache: true
      - name: Build installer
        run: make installer PROFILE=release
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: build/installer
          retention-days: 7

  publish:
    needs: [meta, build, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.6"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: core-gnu
          path: build/gnu/release
      - uses: actions/download-artifact@v4
        with:
          name: core-musl
          path: build/musl/release
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: build/installer
      - name: Stage core release
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tools/release.sh core --libc gnu --platform rockchip-stock --out dist --version "$VERSION"
          tools/release.sh core --libc gnu --platform amlogic-stock --out dist --version "$VERSION"
          tools/release.sh core --libc musl --platform amlogic-alpine --out dist --version "$VERSION"
          tools/release.sh installer --out dist --version "$VERSION"
          tools/release.sh checksums --out dist
      - name: Verify core release
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          jq -e --arg v "$VERSION" \
            '.schema == 1 and .version == $v and
             (.firmwares | keys | sort) == ["amlogic-alpine","amlogic-stock","rockchip-stock"]' \
            dist/release.json
          jq -e '[.firmwares[].apps | length == 0] | all' dist/release.json
          jq -r '.firmwares[].bundle.path' dist/release.json |
            while IFS= read -r path; do
              case "$path" in */*) echo "nested asset: $path" >&2; exit 1;; esac
              test -f "dist/$path"
            done
          tmp=$(mktemp -d)
          tar -xzf "dist/capsulad-installer_${VERSION}_linux_amd64.tar.gz" -C "$tmp"
          "$tmp/capsulad-installer" -version | grep -F "capsulad-installer $VERSION"
          rm -rf "$tmp"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            [ "$draft" = "true" ] || {
              echo "release $tag is already published; cut a new tag" >&2
              exit 1
            }
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > /tmp/remote-assets
          (cd dist && ls -1 | sort) > /tmp/local-assets
          diff -u /tmp/local-assets /tmp/remote-assets
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --latest
          fi
