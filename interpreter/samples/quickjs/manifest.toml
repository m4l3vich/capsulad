id = "org.example.quickjs-sample"
name = "QuickJS Sample"
version = "0.1.0"
description = "Runnable QuickJS app: registers AppBus handlers, calls a framework service and exposes an echo service."
background = true
start_on_boot = false
restart_on_failure = true
provides = ["script_demo"]

[entrypoint]
runtime = "quickjs"
path = "main.js"
sdk = "0.5"

[[settings]]
key = "greeting"
label = "Greeting"
description = "Text returned by the sample echo handler."
type = "text"
default = "hello from QuickJS"

[[actions]]
id = "greet"
label = "Log a greeting"
