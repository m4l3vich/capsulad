id = "org.example.micropython-sample"
name = "MicroPython Sample"
version = "0.1.0"
description = "Runnable MicroPython app: registers AppBus handlers, calls a framework service and exposes an echo service."
background = true
start_on_boot = false
restart_on_failure = true
single_instance = true
provides = ["script_demo"]

[entrypoint]
runtime = "micropython"
path = "main.py"
sdk = "0.5"

[[settings]]
key = "greeting"
label = "Greeting"
description = "Text returned by the sample echo handler."
type = "text"
default = "hello from MicroPython"

[[actions]]
id = "greet"
label = "Log a greeting"
