# Example supervised application manifest for draft 0.5 (illustrative TOML).
id = "org.example.ring-controller"
name = "Ring Controller"
background = true
start_on_boot = true
restart_on_failure = true
single_instance = true
provides = ["led_ring_controller"]

[entrypoint]
runtime = "native"
path = "bin/controller"
architecture = "aarch64"  # illustrative; actual target-dependent
abi = "linux-musl"        # illustrative; actual target-dependent

# No declared output ports: the app creates ring presentations dynamically.

[[settings]]
key = "visualizer_enabled"
label = "Enable media visualizer"
type = "boolean"
default = true

[[settings]]
key = "media_source"
label = "Preferred media player"
type = "text"

[[actions]]
id = "reload"
label = "Reload"

[[interfaces]]
service = "org.example.ring.v1.RingControllerService"
version = "1.0.0"
descriptor = "schemas/ring.protoset"
docs = "docs/ring-api.md"
