id = "org.capsulad.radio"
name = "Internet Radio"
version = "0.2.0"
description = "Internet radio player: keeps a station list, fetches and decodes one MP3 stream in-process through the shared capsulad network stack, plays it through the framework speaker and serves the standard media contract. See README.md."
# A media provider must already be running to answer the standard contract and
# the play/pause/next/previous actions. It stays idle until a station is
# selected and played, and autoplay is off by default.
background = true
start_on_boot = true
restart_on_failure = true
single_instance = true
provides = ["media_player"]

[entrypoint]
runtime = "native"
path = "bin/radio"
architecture = "aarch64"
abi = "linux-gnu"
sdk = "0.5"

# The app links only the Go SDK, which dlopens the shared Capsulad engine. The
# engine is injected by the launcher and is never bundled into this package.
[native_sdk]
abi_major = 1
min_minor = 0

[settings_ui]
html = "ui/settings.html"

[[settings]]
key = "stations"
label = "Stations"
description = "One station per line, \"Name | URL\". Blank lines and lines starting with # are ignored. http:// and https:// stream URLs only; at most 99 stations."
type = "text"
default = "# One station per line: Name | stream URL\nSomaFM Groove Salad | https://ice1.somafm.com/groovesalad-128-mp3\nRadio Paradise Main Mix | https://stream.radioparadise.com/mp3-192"

[[settings]]
key = "station"
label = "Selected station"
description = "1-based number of the selected station in the list. Changing it switches a playing station; the app also updates it when the station changes from the media contract or the next/previous actions."
type = "integer"
default = 1
min = 1
max = 99

[[settings]]
key = "autoplay"
label = "Play at startup"
description = "Start the selected station as soon as the app is ready. Off by default: a radio that starts talking on its own after a reboot is a surprise."
type = "boolean"
default = false

[[settings]]
key = "always_display"
label = "Always display station number"
description = "Keep the selected station number on the segment display while the radio is active. Off by default: the number appears while tuning and playing, then the display releases to the selected baseline 10 seconds after tuning without changing audio or the LED ring."
type = "boolean"
default = false

[[actions]]
id = "play"
label = "Play"
description = "Play the selected station. While paused this re-dials the station, because pausing ends the network stream."

[[actions]]
id = "pause"
label = "Pause"
description = "Pause playback. The station stream is closed; play re-dials it."

[[actions]]
id = "stop"
label = "Stop"
description = "Stop playback, close the station stream and release the display."

[[actions]]
id = "next"
label = "Next station"
description = "Select the next station in the list and play it."

[[actions]]
id = "previous"
label = "Previous station"
description = "Select the previous station in the list and play it."

[[actions]]
id = "dismiss"
label = "Dismiss"
description = "Stop playback and return to the idle baseline. This is the action the device's circle key uses to dismiss the radio."

[[arguments]]
name = "station"
description = "Station to select and play: the 1-based number, the exact name, or the stream URL."
type = "text"
required = false

[[interfaces]]
service = "capsulad.contracts.media.v1.MediaPlayerService"
version = "v1"
descriptor = "proto/media.protoset"
docs = "proto/media.md"