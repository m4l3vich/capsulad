id = "org.capsulad.radio.tuner"
name = "Internet Radio Tuner"
version = "0.1.0"
description = "Native companion for the Internet Radio app: fetches an MP3 stream over the shared capsulad network stack, strips ICY metadata, decodes it and pushes bounded PCM chunks to the radio player over the app bus. Serves org.capsulad.radio.v1.RadioTunerService."
# The radio discovers a running tuner through AppInterfaceService, so the tuner
# runs at boot and stays idle until a Tune arrives.
background = true
start_on_boot = true
restart_on_failure = true
single_instance = true

# Caller authorization: Tune/Stop are served only to the configured player app's
# ready run. The handler matches the daemon-verified ServerCall.CallerRunID()
# against the run ids AppInterfaceService.ListInterfaces publishes for that app,
# and refuses any caller the framework cannot name with PERMISSION_DENIED.
[entrypoint]
runtime = "native"
path = "bin/tuner"
architecture = "aarch64"
abi = "linux-gnu"
sdk = "0.5"

[native_sdk]
abi_major = 1
min_minor = 0

[[settings]]
key = "player_app"
label = "Radio player app id"
description = "App id the tuner is allowed to push decoded PCM to. A Tune request naming any other player is refused. Defaults to the Internet Radio app."
type = "text"
default = "org.capsulad.radio"

[[interfaces]]
service = "org.capsulad.radio.v1.RadioTunerService"
version = "v1"
# Deliberately no descriptor: the radio calls these methods with raw protobuf,
# and a copy of the authoritative proto lives in the radio package.
