<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Radio</title>
</head>
<body>
<main class="capsulad-ui p-3">
  <div class="card bg-base-100 border border-base-300">
    <div class="card-body gap-4">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 class="card-title">Internet Radio</h2>
          <p class="text-sm text-base-content/60">Pick a station to make it the selected station. Play, Pause, Next and Previous are on the device, the Web UI and the media contract.</p>
        </div>
        <span class="badge badge-ghost shrink-0" id="state-pill">Loading</span>
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text">Selected station</span></label>
        <div id="picker" class="flex flex-col gap-2" role="listbox" aria-label="Selected station"></div>
        <p class="text-sm text-base-content/60 mt-2" id="selection-note"></p>
      </div>

      <div class="form-control">
        <label class="label" for="stations"><span class="label-text">Stations</span></label>
        <textarea id="stations" class="textarea textarea-bordered w-full font-mono" rows="8" spellcheck="false" placeholder="Name | https://example.com/stream.mp3"></textarea>
        <label class="label"><span class="label-text-alt">One station per line as Name | URL. Blank lines and lines starting with # are ignored. Only http:// and https:// streams are accepted; at most 99 stations. MP3 streams are supported.</span></label>
      </div>

      <label class="label cursor-pointer justify-start gap-3" for="autoplay">
        <input id="autoplay" type="checkbox" class="checkbox">
        <span class="label-text">Play the selected station when the app starts</span>
      </label>

      <label class="label cursor-pointer justify-start gap-3" for="always-display">
        <input id="always-display" type="checkbox" class="checkbox">
        <span class="label-text">Always display station number</span>
      </label>

      <div class="flex flex-wrap items-center gap-2">
        <button id="save" type="button" class="btn btn-primary">Save station list</button>
      </div>
      <div class="alert" id="status" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
</main>
<script>
(function () {
  'use strict';
  if (!window.CapsuladUI) {
    document.getElementById('status').textContent = 'The settings bridge is unavailable.';
    return;
  }

  var picker = document.getElementById('picker');
  var stations = document.getElementById('stations');
  var autoplay = document.getElementById('autoplay');
  var alwaysDisplay = document.getElementById('always-display');
  var save = document.getElementById('save');
  var status = document.getElementById('status');
  var pill = document.getElementById('state-pill');
  var selectionNote = document.getElementById('selection-note');

  var current = { values: {}, schema: { settings: [] }, revision: '0' };
  // draftDirty means the textarea holds an unsubmitted edit. Incoming state
  // must never overwrite it. pendingSave is the newest Save only:
  // {id: patch request id, text: submitted textarea}. The patch result for
  // exactly that id is the only acknowledgement; a predecessor's result or
  // snapshot cannot clear a newer draft.
  var draftDirty = false;
  var pendingSave = null;
  var lastPatchId = 0;

  function sendPatch(changes) {
    var id = CapsuladUI.patch(changes);
    if (id) lastPatchId = id;
    return id;
  }

  function setPill(text, kind) {
    pill.textContent = text;
    if (kind === 'ok') pill.className = 'badge badge-success';
    else if (kind === 'warn') pill.className = 'badge badge-warning';
    else if (kind === 'err') pill.className = 'badge badge-error';
    else pill.className = 'badge badge-ghost';
  }

  function setStatus(text, kind) {
    status.textContent = text || '';
    status.hidden = !text;
    if (kind === 'ok') status.className = 'alert alert-success';
    else if (kind === 'err') status.className = 'alert alert-error';
    else status.className = 'alert';
  }

  function settingValue(key, fallback) {
    var entry = current.values[key];
    if (entry === undefined || entry === null) return fallback;
    try { return JSON.parse(entry); } catch (_) { return fallback; }
  }

  function parseStations(text) {
    var found = [];
    var lines = String(text || '').split('\n');
    for (var i = 0; i < lines.length && found.length < 99; i++) {
      var line = lines[i].trim();
      if (!line || line.charAt(0) === '#') continue;
      var name = '';
      var url = line;
      var split = line.indexOf('|');
      if (split > 0) {
        var candidate = line.slice(split + 1).trim();
        if (candidate.indexOf('http://') === 0 || candidate.indexOf('https://') === 0) {
          name = line.slice(0, split).trim();
          url = candidate;
        }
      }
      if (url.indexOf('http://') !== 0 && url.indexOf('https://') !== 0) continue;
      found.push({ name: name || url, url: url });
    }
    return found;
  }

  function selectedNumber() {
    var n = Number(settingValue('station', 1));
    return Number.isFinite(n) ? Math.trunc(n) : 1;
  }

  function renderPicker() {
    var list = parseStations(settingValue('stations', ''));
    var selected = selectedNumber();
    picker.replaceChildren();
    if (!list.length) {
      var empty = document.createElement('p');
      empty.className = 'text-sm text-base-content/60';
      empty.textContent = 'No stations yet. Add one below and save.';
      picker.appendChild(empty);
      selectionNote.textContent = '';
      return;
    }
    list.forEach(function (station, index) {
      var number = index + 1;
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn btn-ghost h-auto justify-start normal-case text-left';
      button.setAttribute('role', 'option');
      button.setAttribute('aria-selected', String(number === selected));
      if (number === selected) button.classList.add('btn-active');

      var badge = document.createElement('span');
      badge.className = 'badge badge-ghost shrink-0';
      badge.textContent = String(number);
      var text = document.createElement('span');
      text.className = 'w-full';
      var title = document.createElement('strong');
      title.textContent = station.name;
      var url = document.createElement('span');
      url.className = 'font-mono text-base-content/60';
      url.textContent = station.url;
      text.appendChild(title);
      text.appendChild(document.createElement('br'));
      text.appendChild(url);
      button.appendChild(badge);
      button.appendChild(text);
      button.addEventListener('click', function () {
        if (number === selectedNumber()) return;
        sendPatch([{ key: 'station', valueJson: String(number) }]);
      });
      picker.appendChild(button);
    });
    var valid = selected >= 1 && selected <= list.length;
    selectionNote.textContent = valid
      ? 'Selected: ' + selected + ' — ' + list[selected - 1].name
      : 'Selected station ' + selected + ' is not in the list. Pick one above.';
    selectionNote.className = valid ? 'text-sm text-base-content/60 mt-2' : 'text-sm text-error mt-2';
  }

  function applyState(state) {
    current = state || current;
    var values = {};
    (state.values || []).forEach(function (item) {
      if (item && item.key) values[item.key] = item.valueJson;
    });
    current.values = values;
    // A snapshot is not an acknowledgement for a specific patch. While a draft
    // exists it is never overwritten; pendingSave's own result is the only
    // thing that clears it. The independent switches always follow the
    // authoritative snapshot, so a station-list draft cannot block them.
    if (!draftDirty) {
      stations.value = settingValue('stations', '');
    }
    autoplay.checked = Boolean(settingValue('autoplay', false));
    alwaysDisplay.checked = Boolean(settingValue('always_display', false));
    setPill('Ready', 'ok');
    renderPicker();
    CapsuladUI.resize();
  }

  stations.addEventListener('input', function () { draftDirty = true; });

  autoplay.addEventListener('change', function () {
    sendPatch([{ key: 'autoplay', valueJson: autoplay.checked ? 'true' : 'false' }]);
  });

  // The display preference is its own setting. A change writes only this key
  // through the bridge's compare-and-swap patch, so an unsaved station-list
  // draft is neither submitted nor discarded.
  alwaysDisplay.addEventListener('change', function () {
    sendPatch([{ key: 'always_display', valueJson: alwaysDisplay.checked ? 'true' : 'false' }]);
  });

  save.addEventListener('click', function () {
    // Saving the list must never change the configured selection. If the
    // selected slot is no longer present, the picker renders the existing
    // unavailable-selection message and the user must choose explicitly.
    var submitted = stations.value;
    setStatus('Saving…');
    var id = sendPatch([{ key: 'stations', valueJson: JSON.stringify(submitted) }]);
    if (id) pendingSave = { id: id, text: submitted };
  });

  CapsuladUI.onState(applyState);
  CapsuladUI.onResult(function (result) {
    if (pendingSave && result.requestId === pendingSave.id) {
      // This is the result for the newest Save. Only an accepted save whose
      // submitted text is still the textarea content clears the draft; a
      // failed save or a newer edit keeps it.
      var acknowledged = pendingSave;
      pendingSave = null;
      if (result.ok) {
        if (stations.value === acknowledged.text) {
          draftDirty = false;
          setStatus('Saved.', 'ok');
          setPill('Saved', 'ok');
        } else {
          setStatus('Saved; newer edits are still unsaved.', '');
          setPill('Unsaved draft', 'warn');
        }
      } else {
        setStatus(result.error || result.message || 'The change was rejected.',
          'err');
        setPill('Needs attention', 'err');
      }
    } else if (!pendingSave && result.requestId === lastPatchId) {
      // Only the latest patch's result may speak for an unrelated control. A
      // predecessor save's late result never claims or clears the draft.
      setStatus(result.ok ? 'Saved.' : (result.error || result.message || 'The change was rejected.'),
        result.ok ? 'ok' : 'err');
    }
    CapsuladUI.resize();
  });

  CapsuladUI.resize();
})();
</script>
</body>
</html>
