id = "org.capsulad.cadence"
name = "Cadence Client"
version = "0.1.0"
description = "Voice-assistant client for a self-hosted Cadence server: streams the microphone as Opus over the cadence.v2 device link, plays streamed replies and announcements, and shows the ring as the capture indication."
background = false
start_on_boot = false
restart_on_failure = true
provides = ["voice_assistant"]

[entrypoint]
runtime = "native"
path = "cadence"
architecture = "aarch64"
abi = "linux-gnu"
sdk = "0.5"

# The app links only the Go SDK, which dlopens the shared Capsulad engine. It
# also dlopens libopus at run time; no codec or engine is bundled.
[native_sdk]
abi_major = 1
min_minor = 0

[[actions]]
id = "dismiss"
label = "Dismiss the current turn"
description = "Cancels the running Cadence session, aborts reply playback, releases the microphone and ring, and drops activations queued behind it. The process stays running and ready."

[[settings]]
key = "server_url"
label = "Cadence server URL"
description = "Base URL of the self-hosted Cadence server, for example https://cadence.example.com. The device link is opened at <server_url>/v2/device. http:// is allowed for a LAN or development server but sends the device token and microphone audio unencrypted, and logs one warning."
type = "text"
default = ""

[[settings]]
key = "enroll_code"
label = "Enrollment code"
description = "The one-time code the Cadence dashboard made for this device. The app exchanges it at <server_url>/v2/enroll using the board below, stores the returned device token in Device token and clears this code. It is single-use and expires after 30 minutes. Never logged. Ignored when a device token is already set."
type = "text_masked"
default = ""

[[settings]]
key = "device_token"
label = "Device token"
description = "Bearer token of this device as the Cadence server enrolled it. Never logged. device_token_file wins when set; an enrollment code obtains a token when this is empty."
type = "text_masked"
default = ""

[[settings]]
key = "device_token_file"
label = "Device token file"
description = "Path to a file holding the device token, re-read on every settings change so it can be rotated. Takes precedence over device_token; an unreadable or empty file is rejected and the previous configuration kept."
type = "text"
default = ""

[[settings]]
key = "board"
label = "Cadence board"
description = "Board id this client reports in Hello and uses when exchanging an enrollment code. Automatic reports vk-capsula-mini on the speaker and sim on the simulator. The dashboard's default choice is Simulator, so a real speaker enrolled without changing that choice needs sim here; the recommended dashboard choice is VK Capsula Mini."
type = "select"
default = "auto"

[[settings.choices]]
value = "auto"
label = "Automatic (VK Capsula Mini on the speaker, Simulator on the simulator)"

[[settings.choices]]
value = "vk-capsula-mini"
label = "VK Capsula Mini"

[[settings.choices]]
value = "sim"
label = "Simulator"

[[settings]]
key = "ca_pem"
label = "Extra CA certificate (PEM or asset path)"
description = "PEM certificate(s) appended to the system trust store for a self-hosted CA, either pasted or as a path in the shared Assets store (cadence/ca.pem, or the canonical /assets/cadence/ca.pem shown by the Assets page). Empty uses the system store only. There is no insecure mode: verification is always required."
type = "text"
default = ""

[[settings]]
key = "hold_release_tail_ms"
label = "Hold-release silence tail (ms)"
description = "After a hold-to-talk release the client stops capturing and streams this much digital silence, paced at real time, so the server's recognizer closes the utterance; cadence.v2 has no device end-of-utterance message. Bounded 0-5000. It is dead air the user hears as latency."
type = "integer"
default = 1000
min = 0
max = 5000

[[settings]]
key = "follow_up"
label = "Follow-up windows"
description = "When the server offers a follow-up window after a complete reply, keep the microphone and indication open and start a follow-up session. Turn off to end every turn at the server's close."
type = "boolean"
default = true
