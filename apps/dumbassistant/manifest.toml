id = "org.capsula.dumbassistant"
name = "Dumb Assistant"
version = "0.1.0"
description = "Optional first-party assistant that answers every activation with the same packaged audio reply after a configurable delay."
background = false
start_on_boot = false
restart_on_failure = true
single_instance = true
provides = ["voice_assistant"]

[entrypoint]
runtime = "native"
path = "dumbassistant"
architecture = "aarch64"
abi = "linux-gnu"
sdk = "0.5"

# The app links only the Go SDK, which dlopens the shared Capsula engine. The
# engine is injected by the launcher and is never bundled into this package.
# Every capability below is exercised by the assistant: activations, settings
# and invocation notifications over the app bus, PCM playback, and ring
# presentations/captures over audio and routing services.
[native_sdk]
abi_major = 1
min_minor = 0
required_capabilities = [
  "capsula.service.audio",
  "capsula.audio.playback",
  "capsula.audio.pcm-fast-path",
  "capsula.service.presentation",
  "capsula.service.routing",
  "capsula.service.assistant",
  "capsula.bus.connect",
  "capsula.bus.events",
  "capsula.bus.notifications",
]

[[settings]]
key = "delay_mode"
label = "Delay mode"
description = "Constant waits delay_ms every time. Random picks uniformly between delay_min_ms and delay_max_ms."
type = "select"
default = "constant"

[[settings.choices]]
value = "constant"
label = "Constant"

[[settings.choices]]
value = "random"
label = "Random in range"

[[settings]]
key = "delay_ms"
label = "Constant delay (ms)"
description = "Wait before playing the reply when delay_mode is constant."
type = "integer"
default = 1000
min = 0.0
max = 60000.0

[[settings]]
key = "delay_min_ms"
label = "Minimum random delay (ms)"
description = "Lower bound used when delay_mode is random."
type = "integer"
default = 500
min = 0.0
max = 60000.0

[[settings]]
key = "delay_max_ms"
label = "Maximum random delay (ms)"
description = "Upper bound used when delay_mode is random. A value below the minimum is swapped at use time."
type = "integer"
default = 2500
min = 0.0
max = 60000.0
