id = "org.capsula.dumbassistant"
name = "Dumb Assistant"
version = "0.2.0"
description = "Optional first-party assistant that listens to real microphone PCM, waits for speech to end, and answers with a packaged WAV after a configurable delay."
background = false
start_on_boot = false
restart_on_failure = true
single_instance = true
provides = ["voice_assistant"]

[entrypoint]
runtime = "native"
path = "dumbassistant"
architecture = "aarch64"
abi = "linux-gnu"
sdk = "0.5"

# The app links only the Go SDK, which dlopens the shared Capsula engine. The
# engine is injected by the launcher and is never bundled into this package.
# Every capability below is exercised by the assistant: activations, settings
# and invocation notifications over the app bus, microphone capture and PCM
# playback, device settings for hold-to-talk mode, and ring presentations and
# captures over audio and routing services.
[native_sdk]
abi_major = 1
min_minor = 0
required_capabilities = [
  "capsula.service.audio",
  "capsula.audio.capture",
  "capsula.audio.playback",
  "capsula.audio.pcm-fast-path",
  "capsula.service.presentation",
  "capsula.service.routing",
  "capsula.service.assistant",
  "capsula.service.settings",
  "capsula.bus.connect",
  "capsula.bus.events",
  "capsula.bus.notifications",
]

[[actions]]
id = "dismiss"
label = "Dismiss the current turn"
description = "Stops playback and listening immediately and returns to idle without restarting the app."

[[settings]]
key = "delay"
label = "Reply delay"
description = "Empty waits no time. A single value waits that many milliseconds (100 = 100 ms). A range like 200-1500 waits a uniformly random time between the bounds, inclusive. Negative, inverted, malformed and above-60000 values are rejected."
type = "text"
default = "1000"

[[settings]]
key = "reply_asset"
label = "Reply WAV asset"
description = "Path relative to the shared read-only /assets asset store, for example audio/assistant/reply.wav. Empty uses the packaged assets/reply.wav. Absolute paths, '..' traversal, symlinks and assets not declared in the store manifest are rejected."
type = "text"
default = ""
