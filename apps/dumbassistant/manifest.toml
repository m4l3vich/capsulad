id = "org.capsulad.dumbassistant"
name = "Dumb Assistant"
version = "0.2.0"
description = "Optional first-party assistant that listens to real microphone PCM, waits for speech to end, and answers with a packaged WAV after a configurable delay."
background = false
start_on_boot = false
restart_on_failure = true
provides = ["voice_assistant"]

[entrypoint]
runtime = "native"
path = "dumbassistant"
architecture = "aarch64"
abi = "linux-gnu"
sdk = "0.5"

# The app links only the Go SDK, which dlopens the shared Capsulad engine. The
# engine is injected by the launcher and is never bundled into this package.
# [native_sdk] is requirement metadata the supervisor checks before install and
# launch.
[native_sdk]
abi_major = 1
min_minor = 0

[[actions]]
id = "dismiss"
label = "Dismiss the current turn"
description = "Stops playback and listening immediately and returns to idle without restarting the app."

[[settings]]
key = "delay"
label = "Reply delay"
description = "Empty waits no time. A single value waits that many milliseconds (100 = 100 ms). A range like 200-1500 waits a uniformly random time between the bounds, inclusive. Negative, inverted, malformed and above-60000 values are rejected."
type = "text"
default = "1000"

[[settings]]
key = "reply_asset"
label = "Reply WAV asset"
description = "Path relative to the shared read-only /assets asset store, for example audio/assistant/reply.wav. Empty uses the packaged assets/reply.wav. Absolute paths, '..' traversal, symlinks and files that are not regular .wav assets are rejected."
type = "text"
default = ""
