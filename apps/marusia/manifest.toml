id = "org.capsulad.marusia"
name = "Marusia"
version = "0.1.0"
description = "VK Marusia voice assistant: streams microphone PCM to the recovered vendor gRPC service and plays the returned TTS URL."
background = false
start_on_boot = false
restart_on_failure = true
single_instance = true
provides = ["voice_assistant"]

[entrypoint]
runtime = "native"
path = "marusia"
architecture = "aarch64"
abi = "linux-gnu"
sdk = "0.5"

# The app links only the Go SDK, which dlopens the shared Capsulad engine. The
# engine is injected by the launcher and is never bundled into this package.
[native_sdk]
abi_major = 1
min_minor = 0

[[actions]]
id = "dismiss"
label = "Dismiss the current turn"
description = "Aborts the in-flight phrase, stops playback and returns to idle without restarting the app."

[[actions]]
id = "reauth"
label = "Re-run device attach"
description = "Repeats the session attach handshake with the configured xtoken id and reports the result."

[[settings]]
key = "endpoint"
label = "Service endpoint"
description = "Vendor deployment the device talks to. Custom overrides it when non-empty. Test 2 is a plaintext http:// deployment: the session and xtoken travel without TLS, so selecting it logs one warning."
type = "select"
default = "prod"
[[settings.choices]]
value = "prod"
label = "Production (vc.go.mail.ru)"
[[settings.choices]]
value = "test1"
label = "Test 1 (vc1.go.mail.ru)"
[[settings.choices]]
value = "test2"
label = "Test 2 (voice-test2.ngx.openstack.go.devmail.ru, plaintext http:// — credential sent unencrypted)"
[[settings.choices]]
value = "stag1"
label = "Staging (s1-vc.go.mail.ru)"
[[settings.choices]]
value = "dev"
label = "Dev (vc1.go.devmail.ru)"

[[settings]]
key = "endpoint_custom"
label = "Custom base URL"
description = "Overrides endpoint when non-empty. Must be http:// or https:// with a host and no path, query or fragment. An http:// base sends the session and xtoken without TLS and logs one warning."
type = "text"
default = ""

[[settings]]
key = "xtoken_id"
label = "Provisioned xtoken id"
description = "Manufacturing credential used only if no valid session is configured or found in the vendor session file."
type = "text_masked"
default = ""

[[settings]]
key = "session_id"
label = "Session id"
description = "Optional vendor session id. Takes precedence over the vendor session file and is masked."
type = "text_masked"
default = ""

[[settings]]
key = "session_secret"
label = "Session secret"
description = "Optional vendor bearer secret. Takes precedence over the vendor session file. Never include in logs."
type = "text_masked"
default = ""

[[settings]]
key = "session_file"
label = "Vendor session file"
description = "Path to the vendor agent session.json. The matching device_settings.json is read beside it."
type = "text"
default = "/data/voice-agent/session.json"

[[settings]]
key = "serial"
label = "Device serial override"
description = "Sent as x-device-sn and as the attach serial. Optional: when empty CAPSULAD_DEVICE_SERIAL, framework hardware_serial, then local /proc/cpuinfo supply the SoC serial in that order; this setting always wins."
type = "text"
default = ""

[[settings]]
key = "device_id"
label = "Device id"
description = "Sent as x-device-id. When empty, the framework device id (DeviceService.GetInfo) is used, then a per-process UUID. Masked because it is a stable device identifier."
type = "text_masked"
default = ""

[[settings]]
key = "audio_format"
label = "Upload audio format"
description = "Framing of the microphone stream on the gRPC phrase upload."
type = "select"
default = "wave"
[[settings.choices]]
value = "wave"
label = "PCM in WAV (AUDIO_FORMAT_WAVE)"
[[settings.choices]]
value = "ogg_opus"
label = "Ogg Opus (AUDIO_FORMAT_OGG_OPUS)"

[[settings]]
key = "client_version"
label = "Client version string"
description = "Advertised firmware version in x-device-ver and DeviceInfo.version."
type = "text"
default = "44.91"

[[settings]]
key = "keyword"
label = "Keyword name"
description = "Keyword sent in keyword_options.kw_params."
type = "text"
default = "marusya"

[[settings]]
key = "hw_id"
label = "Keyword hardware id"
description = "Keyword id sent in keyword_options.kw_params."
type = "text"
default = "9F25725B"
[[settings]]
key = "keyword_mode"
label = "Keyword policy"
description = "no_kw transcribes the command directly. kw_params requires the uploaded phrase to begin with the keyword: the service confirms the keyword from the received audio, so a capture that starts after the wake word is answered \"keyword not confirmed\". Keep no_kw unless you are testing a whole utterance that starts with the wake word."
type = "select"
default = "no_kw"
[[settings.choices]]
value = "no_kw"
label = "No keyword (transcribe the command)"
[[settings.choices]]
value = "kw_params"
label = "Keyword params (phrase must start with the wake word)"

[[settings]]
key = "capabilities_json"
label = "Client capabilities payload"
description = "JSON sent as RequestClientOptions.capabilities.json in the phrase init. The default carries the capability token the shipped Capsula Mini firmware sent on /connect (31c0255a004201d1408a235de880400000); the vendor's exact JSON schema was not recoverable, so override this with the exact vendor payload if you have it. An empty value is rejected: a phrase opened without capabilities never produced text."
type = "text"
default = "{\"capabilities_hex\":\"31c0255a004201d1408a235de880400000\"}"

[[settings]]
key = "client_data_json"
label = "Client data payload"
description = "JSON sent as RequestClientOptions.client_data.json. Empty leaves the field unset, which is what the vendor's own init does unless its control connection supplies client data."
type = "text"
default = ""
