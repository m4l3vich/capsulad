id = "org.capsulad.soundboard"
name = "Soundboard"
version = "0.1.0"
description = "QuickJS soundboard: centre plays the active /assets WAV, left/right swipes switch sounds, the segment display briefly shows the active name and the ring lights the sound's configured colour. Sounds are edited as structured JSON in the custom settings UI. See README.md."
background = false
start_on_boot = false
restart_on_failure = false

[entrypoint]
runtime = "quickjs"
path = "main.js"
sdk = "0.5"

[settings_ui]
html = "ui/settings.html"

[[settings]]
key = "sounds"
label = "Sounds"
description = "JSON array of sounds. Each entry: name (1-4 seven-segment characters), asset (/assets/*.wav) and color (#rrggbb or random). Use the custom editor below."
type = "text"
default = "[]"
