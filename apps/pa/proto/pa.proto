// PA speaker interface (org.capsulad.pa.v1).
//
// The application is a background MicroPython service: it accepts one
// RIFF/WAVE file over this interface and plays it on the framework speaker
// through AudioService.Playback. The wire form is raw protobuf; the packaged
// pa.protoset publishes the same schema for JSON callers and the Web UI.
//
// Play is bidirectional and credit-based. The app consumes one request frame
// at a time on a single-threaded host, so it grants frame credits as it
// consumes them. A caller may have at most the credits it has received in
// flight; it must not pre-send a whole clip. This is what keeps a slow app or a
// queued call from overflowing the native SDK's inbound request queue.
syntax = "proto3";

package org.capsulad.pa.v1;

message PlayRequest {
  // The next slice of one WAV file. The concatenation of the `data` field of
  // every request message in the call is exactly one RIFF/WAVE file; the file
  // may be split anywhere, including inside the RIFF header. PCM is never
  // base64: this field carries raw file bytes.
  //
  // Every request message must carry at least one byte: the app makes progress
  // per frame, and a frame without WAV bytes is rejected with INVALID_ARGUMENT.
  bytes data = 1;
}

message PlayCredit {
  // Number of additional request frames the caller may send. The app starts
  // every call with an initial grant of two frames (see docs/speaker.md) and
  // grants one more frame after it has fully consumed each request frame.
  uint32 frames = 1;
}

message PlayResult {
  // True only when the whole declared audio reached the speaker and the
  // framework drained it. A rejected or truncated file ends the call with a
  // non-OK gRPC status instead, so a reply always means success.
  bool played = 1;
  // Interleaved PCM frames accepted for playback.
  uint32 frames = 2;
  uint32 sample_rate_hz = 3;
  uint32 channels = 4;
  string detail = 5;
}

message PlayEvent {
  oneof event {
    // Flow-control grant. Credits arrive before the first request frame and
    // after each consumed frame; a caller must honor them.
    PlayCredit credit = 1;
    // Terminal success payload, sent before the app's OK end frame.
    PlayResult result = 2;
  }
}

service SpeakerService {
  // Play streams one WAV file to the device speaker. The request side is a
  // client stream; the response side carries consumer credits followed by one
  // PlayResult. Half-close marks the end of the file. Deleting the call
  // (cancelling it) before the result discards queued audio immediately.
  rpc Play(stream PlayRequest) returns (stream PlayEvent);
}
