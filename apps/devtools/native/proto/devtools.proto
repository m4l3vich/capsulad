// Development-only AppBus contract. The handler is deliberately tiny: it
// proves that a supervised app can serve routed calls and that another app can
// reach it through AppBusService.Call without a private socket.
syntax = "proto3";

package dev.devtools.v1;

option go_package = "capsula/apps/devtools/gen/devtools/v1";

message EchoRequest {
  string text = 1;
}

message EchoResponse {
  string text = 1;
  string app_id = 2;
  string run_id = 3;
}

service DevToolsService {
  // Echo returns "echo:<text>" plus the serving app identity. It is unary;
  // client-streaming callers receive one reply per request message.
  rpc Echo(EchoRequest) returns (EchoResponse);
}