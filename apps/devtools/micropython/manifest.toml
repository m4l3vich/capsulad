id = "dev.micropython"
name = "MicroPython Devtools"
version = "0.1.0"
description = "Development-only MicroPython probe: environment identity, framework calls, app settings CAS, action round trip, periodic resource heartbeat and a raw-protobuf AppBus echo handler."
background = false
start_on_boot = false
restart_on_failure = false

[entrypoint]
runtime = "micropython"
path = "main.py"
sdk = "0.5"

[[settings]]
key = "runs"
label = "Probe runs"
description = "Incremented once at startup and once per invocation. The app reads, CAS-writes and logs it through ApplicationConfigurationService."
type = "integer"
default = 0

[[actions]]
id = "probe"
label = "Log framework state"

[[arguments]]
name = "step"
description = "Free-form label echoed in the invocation log."
type = "text"

[[interfaces]]
service = "dev.devtools.v1.ScriptEcho"
version = "v1"