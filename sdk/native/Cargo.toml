[package]
name = "capsula-native"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Capsula native SDK: UDS gRPC engine with a stable C ABI"
publish = false

[lib]
name = "capsula"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-stream = "0.3"
bytes = "1"
http = "1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "unwind"
