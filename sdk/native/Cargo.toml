[package]
name = "capsulad-native"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Capsulad native SDK: UDS gRPC engine, outbound HTTP/remote gRPC and a stable C ABI"
publish = false

[lib]
name = "capsulad"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
getrandom = "0.2"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring", "logging"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "unwind"
